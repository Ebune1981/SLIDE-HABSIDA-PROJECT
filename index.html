<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slider HABIDSA PROJECTS </title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="brands">
    <h1 class="slide-title">Repair equipment from various brands</h1>
    <section class="brand-section" aria-label="Supported brands">
      <div class="brands-swiper swiper">
        <div class="brand-list swiper-wrapper">
          <a class="brand-card swiper-slide" href="#"><img src="./icon-lenonvo.png" alt="Lenovo"></a>
          <a class="brand-card swiper-slide" href="#"><img src="./icon-samsung.png" alt="Samsung"></a>
          <a class="brand-card swiper-slide" href="#"><img src="./icon-apple.png" alt="Apple"></a>
          <a class="brand-card swiper-slide" href="#"><img src="./icon-viewsonic.png" alt="ViewSonic"></a>
          <a class="brand-card swiper-slide" href="#"><img src="./icon-bosch.png" alt="Bosch"></a>
          <a class="brand-card swiper-slide" href="#"><img src="./icon-hp.png" alt="HP"></a>
          <a class="brand-card swiper-slide" href="#"><img src="./icon-acer.png" alt="Acer"></a>
          <a class="brand-card swiper-slide" href="#"><img src="./icon-sony.png" alt="Sony"></a>
          <a class="brand-card swiper-slide" href="#"><img src="./icon-sony.png" alt="Sony"></a>
        </div>
        <div class="swiper-pagination"></div>
      </div>
      <button class="toggle-brands" type="button" aria-expanded="false">
        <span class="toggle-brands-label">Show All</span>
        <svg class="toggle-brands-chevron" aria-hidden="true" viewBox="0 0 16 16" focusable="false">
          <path d="m3 6 5 5 5-5" />
        </svg>
      </button>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const brandSection = document.querySelector('.brand-section');
    const brandSliderElement = document.querySelector('.brands-swiper');
    const toggleButton = document.querySelector('.toggle-brands');
    const toggleButtonLabel = toggleButton.querySelector('.toggle-brands-label');
    let brandSlider;

    function initializeMobileSlider() {
      if (window.innerWidth <= 640 && !brandSection.classList.contains('is-expanded')) {
        brandSliderElement.classList.add('is-slider');
        brandSlider = new Swiper(brandSliderElement, {
          slidesPerView: 1.5,
          spaceBetween: 12,
          pagination: {
            el: '.swiper-pagination',
            clickable: true
          }
        });
      }
    }

    function destroyMobileSlider() {
      if (brandSlider) {
        brandSlider.destroy(true, true);
        brandSlider = undefined;
        brandSliderElement.classList.remove('is-slider');
      }
    }

    toggleButton.addEventListener('click', () => {
      const isExpanded = brandSection.classList.toggle('is-expanded');
      toggleButtonLabel.textContent = isExpanded ? 'Hide' : 'Show All';
      toggleButton.setAttribute('aria-expanded', String(isExpanded));

      if (isExpanded) {
        destroyMobileSlider();
      } else {
        initializeMobileSlider();
      }
    });

    initializeMobileSlider();
  </script>
</body>
</html>
